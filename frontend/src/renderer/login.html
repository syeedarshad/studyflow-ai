<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>StudyFlow AI — Sign In</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      -webkit-app-region: drag;
      background: radial-gradient(circle at 50% 0%, rgba(201,168,76,0.08), transparent 60%), var(--bg);
    }
    .auth-card {
      -webkit-app-region: no-drag;
      width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .auth-logo-icon {
      font-size: 26px;
      color: var(--accent);
    }
    .auth-logo-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text);
    }
    .auth-subtitle {
      text-align: center;
      font-size: 12.5px;
      color: var(--text-3);
      margin-bottom: 24px;
    }
    .auth-tabs {
      display: flex;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 3px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-3);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .auth-tab.active {
      background: var(--accent);
      color: #0a0a0a;
    }
    .auth-field { margin-bottom: 14px; }
    .auth-error {
      display: none;
      font-size: 12px;
      color: var(--danger);
      background: rgba(224,90,90,0.1);
      border: 1px solid rgba(224,90,90,0.25);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .auth-submit { width: 100%; margin-top: 4px; }
    .auth-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-3);
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">⚡</span>
      <span class="auth-logo-text">StudyFlow AI</span>
    </div>
    <div class="auth-subtitle">Your personal AI study operating system</div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" data-mode="login">Sign In</div>
      <div class="auth-tab" id="tab-register" data-mode="register">Create Account</div>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="auth-form">
      <div class="auth-field" id="field-fullname" style="display:none">
        <label class="form-label">Full Name</label>
        <input class="form-input" id="auth-fullname" autocomplete="name" placeholder="Arshad">
      </div>
      <div class="auth-field">
        <label class="form-label">Email</label>
        <input class="form-input" id="auth-email" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label class="form-label">Password</label>
        <input class="form-input" id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary auth-submit" id="auth-submit">Sign In</button>
    </form>

    <div class="auth-hint" id="auth-hint">
      Your session stays signed in on this device until you log out —<br>no need to sign in again after restarting.
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
