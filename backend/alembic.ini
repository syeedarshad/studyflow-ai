# Alembic Configuration — StudyFlow AI
# ─────────────────────────────────────────────────────────────────────────────
# This file configures the Alembic migration tool for the StudyFlow AI backend.
# Run migrations from the backend/ directory:
#
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
# Path to the migration scripts directory
script_location = migrations

# Template for revision file naming
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Database URL for synchronous operations (psycopg2).
# Alembic does not support asyncpg — we use the sync URL here.
#
# ⚠ THIS VALUE IS NEVER USED IN PRACTICE.
# migrations/env.py unconditionally overrides sqlalchemy.url with
# settings.DATABASE_SYNC_URL (read from the DATABASE_SYNC_URL environment
# variable) before any migration command runs.
#
# The sentinel below is intentionally invalid so that any accidental use
# (e.g. missing .env in CI) produces an immediate, obvious connection error
# rather than silently targeting a wrong host.
sqlalchemy.url = postgresql+psycopg2://MISSING_ENV_VAR:MISSING_ENV_VAR@MISSING_HOST:5432/MISSING_DB

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
